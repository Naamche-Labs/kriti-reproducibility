name: Deterministic release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify evidence
        run: |
          python -m pip install -r requirements.txt
          python tools/verify_evidence.py
      - name: Build deterministic archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive="kriti-reproducibility-${TAG}.tar.gz"
          git archive --format=tar --prefix="kriti-reproducibility-${TAG}/" "$GITHUB_SHA" | gzip -n > "$archive"
          sha256sum "$archive" > SHA256SUMS
      - name: Attest archive
        uses: actions/attest@v4
        with:
          subject-path: kriti-reproducibility-${{ github.ref_name }}.tar.gz
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "kriti-reproducibility-${TAG}.tar.gz" SHA256SUMS \
            --verify-tag \
            --title "Kriti reproducibility record ${TAG}" \
            --notes "Deterministic, checksummed evidence archive with GitHub artifact attestation."
